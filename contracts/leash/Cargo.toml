[package]
name = "harbor-leash"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Holds an owner's budget and lets an agent spend it only on 1Click deposits the owner's limits allow."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
ed25519-dalek = "=2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
