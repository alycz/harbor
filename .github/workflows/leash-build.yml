name: Leash WASM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/leash/**'
      - '.github/workflows/leash-build.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/leash/**'
      - '.github/workflows/leash-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/leash
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust WASM target
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustc +stable --version --verbose
      - name: Build locked release WASM (no transactions or tests)
        env:
          RUSTFLAGS: '-C target-cpu=mvp'
        run: cargo +stable build --locked --release --target wasm32-unknown-unknown
      - name: Package contract and checksum
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/harbor_leash.wasm dist/
          cd dist
          sha256sum harbor_leash.wasm > SHA256SUMS
          printf 'Commit: %s\nBuild only. Not deployed, audited, or integration-tested.\n' "$GITHUB_SHA" > BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: leash-wasm-${{ github.sha }}
          path: contracts/leash/dist/
          if-no-files-found: error
          retention-days: 14
